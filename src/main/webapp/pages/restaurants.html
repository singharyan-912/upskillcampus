<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants — FoodieExpress</title>
    <meta name="description" content="Browse restaurants and find your favourite food.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body class="bg-light">

<!-- Navigation -->
<nav class="navbar" id="main-navbar">
    <div class="container nav-inner">
        <a class="nav-logo" href="../index.html">
            <span class="logo-icon">🍕</span> FoodieExpress
        </a>

        <ul class="nav-links">
            <li><a class="nav-link" href="../index.html">Home</a></li>
            <li><a class="nav-link active" href="restaurants.html">Restaurants</a></li>
        </ul>

        <div class="nav-actions">
            <!-- Nav cart icon (hidden until logged in / has items) -->
            <a href="cart.html" class="nav-icon-link" aria-label="Go to Cart">
                🛒
                <span class="nav-badge" id="nav-cart-count" style="display:none;">0</span>
            </a>

            <!-- User avatar + name dropdown placeholder -->
            <div class="nav-user" style="display:flex; align-items:center; gap:0.5rem; margin-left:1rem;">
                <div class="nav-avatar" id="nav-avatar">U</div>
                <span class="nav-user-name" id="nav-user-name">User</span>
                <button class="btn btn-outline btn-sm" id="nav-logout-btn" style="display:none; padding:0.25rem 0.5rem; font-size:0.75rem; margin-left:0.5rem;">Logout</button>
            </div>
        </div>
    </div>
</nav>

<!-- Page Content -->
<main class="page-content container" style="padding-top:calc(var(--nav-height) + 2rem);">
    
    <div class="page-header" style="margin-bottom:2rem;">
        <h1 class="page-title">Discover Restaurants</h1>
        <p class="page-subtitle" id="restaurant-count">Loading restaurants...</p>
    </div>

    <!-- Search & Filters -->
    <div class="search-filter-bar">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="restaurant-search" placeholder="Search for restaurants, cuisines, or locations..." aria-label="Search restaurants">
        </div>
        
        <div class="filter-chips" id="filter-chips" role="group" aria-label="Filter by cuisine">
            <!-- Cuisine chips injected by JS -->
        </div>
    </div>

    <!-- Restaurants Grid -->
    <div class="restaurants-grid" id="restaurants-grid">
        <!-- Rendered by JS -->
    </div>

</main>

<!-- Toast container -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- Scripts -->
<script src="../assets/js/api.js"></script>
<script src="../assets/js/restaurants.js"></script>
</body>
</html>
