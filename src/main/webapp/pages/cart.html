<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — FoodieExpress</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body class="bg-light">

<!-- Navigation -->
<nav class="navbar" id="main-navbar">
    <div class="container nav-inner">
        <a class="nav-logo" href="../index.html">
            <span class="logo-icon">🍕</span> FoodieExpress
        </a>

        <ul class="nav-links">
            <li><a class="nav-link" href="../index.html">Home</a></li>
            <li><a class="nav-link" href="restaurants.html">Restaurants</a></li>
        </ul>

        <div class="nav-actions">
            <a href="cart.html" class="nav-icon-link active" aria-label="Go to Cart">
                🛒
                <span class="nav-badge" id="nav-cart-count" style="display:none;">0</span>
            </a>
            <div class="nav-user" style="display:flex; align-items:center; gap:0.5rem; margin-left:1rem;">
                <div class="nav-avatar" id="nav-avatar">U</div>
                <span class="nav-user-name" id="nav-user-name">User</span>
                <button class="btn btn-outline btn-sm" id="nav-logout-btn" style="display:none; padding:0.25rem 0.5rem; font-size:0.75rem; margin-left:0.5rem;">Logout</button>
            </div>
        </div>
    </div>
</nav>

<!-- Page Content -->
<main class="page-content container" style="padding-top:calc(var(--nav-height) + 2rem);">
    
    <div class="page-header" style="margin-bottom:2rem;">
        <h1 class="page-title">Your Cart</h1>
    </div>

    <!-- Empty State -->
    <div id="cart-empty-state" class="cart-empty" style="display:none; background:white; border-radius:1rem; box-shadow:var(--shadow-sm); border:1px solid var(--color-border-light);">
        <div class="cart-empty-icon">🛒</div>
        <h2>Your cart is empty</h2>
        <p>Looks like you haven't added anything to your cart yet. Browse our restaurants and find something delicious!</p>
        <a href="restaurants.html" class="btn btn-primary" style="margin-top:1rem;">Browse Restaurants</a>
    </div>

    <!-- Layout -->
    <div id="cart-main" class="cart-page-layout">
        
        <!-- Left Column: Items -->
        <div class="cart-items-wrapper">
            <div class="cart-items-container">
                <div class="cart-items-header">
                    <h2>Order Items <span id="cart-item-count" style="font-size:0.9rem; color:var(--color-text-muted); font-weight:normal; margin-left:0.5rem;"></span></h2>
                    <span id="cart-restaurant-name" class="cart-restaurant-name"></span>
                </div>
                
                <div id="cart-items-list" class="cart-items-list">
                    <!-- Items injected by JS -->
                </div>
            </div>
            
            <button id="continue-shopping-btn" class="continue-shopping-link" style="background:none; border:none; padding:1rem; cursor:pointer;">
                ← Continue Shopping
            </button>
        </div>

        <!-- Right Column: Summary -->
        <aside class="cart-order-summary">
            <h3 class="order-summary-title">Order Summary</h3>
            
            <div class="order-summary-line">
                <span>Items (<span id="summary-item-count">0</span>)</span>
                <span id="summary-subtotal">₹0.00</span>
            </div>
            <div class="order-summary-line">
                <span>Delivery Fee</span>
                <span style="color:var(--color-success); font-weight:600;">Free</span>
            </div>
            
            <div class="order-summary-line total">
                <span>Total</span>
                <span class="amount" id="summary-total">₹0.00</span>
            </div>
            
            <button id="checkout-btn" class="checkout-btn" disabled>
                Proceed to Checkout <span>→</span>
            </button>
        </aside>

    </div>
</main>

<!-- Toast container -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- Scripts -->
<script src="../assets/js/api.js"></script>
<script src="../assets/js/cart.js"></script>
</body>
</html>
